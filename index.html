<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gini's Park</title>
  <link rel="icon" type="image/png" href="./images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading-screen">
    <div class="loading-content">
      <p>Find the billboard...</p>
    </div>
  </div>
  <div id="experience">
    <canvas id="experience-canvas"></canvas>
  </div>

  <div class="modal hidden">
    <div class="modal-wrapper">
      <div class="modal-header">
        <h1 class="modal-title"></h1>
        <button class="modal-exit-button">Exit</button>
      </div>
      <div class="modal-content">
        <div class="modal-content-wrapper">
          <p class="modal-project-description "></p>
          <a class="modal-visit-button hidden" href="rate-card.html" target="_blank">RATE CARD</a>
        </div>
      </div>
    </div>
  </div>

  <div id="interaction-prompt" class="hidden">
  <span>Press E to interact</span>
</div>

<div id="character-prompt">
  <span>click me ♡</span>
</div>


<div id="mobile-controls">
  <button class="mobile-button" data-direction="up">↑</button>

  <div class="mobile-middle-row">
    <button class="mobile-button" data-direction="left">←</button>
    <button class="mobile-button" data-direction="down">↓</button>
    <button class="mobile-button" data-direction="right">→</button>
  </div>
</div>


  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@v0.149.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.149.0/examples/jsm/"
    }
  }
</script>
  <script type="module" src="main.js"></script>
</body>
</html>
