<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    html,
    body {
      height: 100%;
      overflow: hidden;
      background-color: #d2c4d3;
    }
    .rate-card {
      box-sizing: border-box;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
      padding: 1.3rem;
    }
    .rate-card img {
      border: 3px solid #550b5a;
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 250px);
      margin: 0 auto;
    }
    a{
      background-color: #f5e6f5;
      width: 50%;
      padding: 0.5rem;
      display: block;
      text-align: center;
      margin: 3rem auto 0;
      text-decoration: none;
      color: #550b5a;
      font-weight: bold;
      border: 2px solid #550b5a;
      border-radius: 20px;
    }
  </style>
  <title>Rate Card</title>
  <link rel="icon" type="image/png" href="./images/favicon.png">
</head>
<body>

  <div class="rate-card">

      <h1>MY RATE CARD</h1>
      <img src="./images/rate-card.png" alt="Rate Card">
       <a href="https://www.instagram.com/ginikaolua/">Get in Touch</a>
    </div>

  


</body>
</html>
